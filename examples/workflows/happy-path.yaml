# yaml-language-server: $schema=./src/schemas/cdrus/workflow.schema.json
workflow:
  id: junction-box-demo-1
  name: junction-box-demo
  cdrus:
    version: 1
    metadata:
      description: cdCon May 2026 Junction Box happy path — full CI/CD chain (Sympraxis)
      owner: Sol Duara
      tags: [jenkins, spinnaker, gke]

  defaults:
    pipeline: junction-box-demo
    timeout_ms: 300000
    min_wait_ms: 100

  produces:
    # ── Jenkins (tool 1) ──────────────────────────────────────────────────────
    - event: dev.cdevents.pipelinerun.started.0.5.1
      tool: jenkins-prod
      source: https://jenkins.example.com/
      pipeline: junction-box-demo

    - expression: build
      tool: jenkins-prod
      source: https://jenkins.example.com/

    - expression: artifact-store
      tool: jenkins-prod
      source: https://jenkins.example.com/

    # ── Spinnaker (tool 2) ───────────────────────────────────────────────────
    - event: dev.cdevents.pipelinerun.started.0.5.1
      tool: spinnaker-prod
      pipeline: junction-box-demo

    - expression: deploy
      tool: spinnaker-prod
      source: https://spinnaker.example.com/
      overrides:
        service.deployed:
          tool: gke-prod
          source: https://gke.example.com/
        service.published:
          tool: gke-prod
          source: https://gke.example.com/

    # ── Terminal ─────────────────────────────────────────────────────────────
    - event: dev.cdevents.pipelinerun.finished.0.5.1
      tool: spinnaker-prod
      source: https://spinnaker.example.com/
      pipeline: junction-box-demo
