# yaml-language-server: $schema=../../schemas/cdrus/workflow.schema.json
workflow:
  id: prod-payments-blue-green-cutover
  group: spin-dev
  author: shipwreck-sa
  name: Payments API — Production Blue/Green Cutover
  cdrus:
    version: 1
    metadata:
      service: payments-api
      strategy: blue-green
      tier: tier-0
      tools: [jenkins, jfrog, spinnaker, gke]
      runbook: https://wiki.spin-dev.io/runbooks/payments-prod-bg

  defaults:
    pipeline: payments-prod-cutover
    timeout_ms: 900000

  produces:
    # ── Jenkins (CI) ──────────────────────────────────────────────────────
    - event: dev.cdevents.pipelinerun.started.0.3.0
      tool: jenkins-prod
      source: https://jenkins.spin-dev.io/
      pipeline: payments-prod-cutover

    - expression: build
      tool: jenkins-prod
      source: https://jenkins.spin-dev.io/

    # ── JFrog (artifact store) ────────────────────────────────────────────
    - expression: artifact-store
      tool: jfrog-prod
      source: https://artifactory.spin-dev.io/

    # ── Spinnaker → GKE (blue/green cutover) ──────────────────────────────
    # blue-green-deploy isn't in spin-dev/shipwreck-sa's own library, so this
    # falls through the resolver to example-group/user/blue-green-deploy
    # (service.deployed → verify → service.published → service.removed).
    - expression: blue-green-deploy
      tool: spinnaker-prod
      source: https://spinnaker.spin-dev.io/
      overrides:
        service.deployed:
          tool: gke-prod
          source: https://gke.spin-dev.io/payments-green
        service.published:
          tool: gke-prod
          source: https://gke.spin-dev.io/payments-cutover
        service.removed:
          tool: gke-prod
          source: https://gke.spin-dev.io/payments-blue

    # ── Terminal ──────────────────────────────────────────────────────────
    - event: dev.cdevents.pipelinerun.finished.0.3.0
      tool: spinnaker-prod
      source: https://spinnaker.spin-dev.io/
      pipeline: payments-prod-cutover
