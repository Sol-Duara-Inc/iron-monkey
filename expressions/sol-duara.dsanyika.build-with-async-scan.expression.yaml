# yaml-language-server: $schema=https://cdrus.dev/schemas/0.2.0/expression.schema.json
group: sol-duara
author: dsanyika
expression: build-with-async-scan
description: Build with an asynchronous security/SBOM scan chain that the build does not wait on. The packaged artifact spawns a detached signed-then-report chain observable to consumers.
produces:
  - expression: build
  - event: dev.cdevents.artifact.packaged.0.3.0
    detach:
      - event: dev.cdevents.artifact.signed.0.3.0
      - event: dev.cdevents.testoutput.published.0.3.0
