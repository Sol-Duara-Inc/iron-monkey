# yaml-language-server: $schema=https://cdrus.dev/schemas/0.1.0/expression.schema.json
group: spin-dev
author: shipwreck-sa
expression: deploy
description: |
  Shipwreck SA — audit-observable, verification-gated deploy. A ticket-
  association chain is spawned at task start so the audit pipeline can
  babysit it. The service is deployed, then verification runs, then the
  service is published — no traffic until verification has passed.
produces:
  - event: dev.cdevents.taskrun.started.0.3.0
    detach:
      - expression: ticket-associate
  - event: dev.cdevents.service.deployed.0.3.0
  - expression: verify
  - event: dev.cdevents.service.published.0.3.0
  - event: dev.cdevents.taskrun.finished.0.3.0
