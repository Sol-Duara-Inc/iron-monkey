# yaml-language-server: $schema=https://cdrus.dev/schemas/0.1.0/expression.schema.json
group: example-group
author: user
expression: ephemeral-environment
description: Preview/PR environment lifecycle — provision, deploy, verify, tear down.
produces:
  - event: dev.cdevents.environment.created.0.3.0
  - expression: deploy
  - expression: verify
  - event: dev.cdevents.environment.deleted.0.3.0
