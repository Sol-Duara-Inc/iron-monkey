# yaml-language-server: $schema=https://cdrus.dev/schemas/0.2.0/expression.schema.json
group: spin-dev
author: shipwreck-sa
expression: artifact-store
description: |
  Shipwreck SA — supply-chain-aware artifact lifecycle. Artifacts MUST be
  signed before they may be published. Unsigned publication is not an option
  in this group; this is the only "artifact-store" semantics on offer.
produces:
  - event: dev.cdevents.artifact.packaged.0.5.1
  - event: dev.cdevents.artifact.signed.0.5.1
  - event: dev.cdevents.artifact.published.0.5.1
