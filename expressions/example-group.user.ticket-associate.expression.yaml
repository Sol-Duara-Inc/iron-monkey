# yaml-language-server: $schema=https://cdrus.dev/schemas/0.2.0/expression.schema.json
group: example-group
author: user
expression: ticket-associate
description: Operations pattern — a ticket is created and associated with downstream SDLC work via an update. References ticket events defined in CDEvents 0.6.0-draft; pins reference their published catalog versions.
produces:
  - event: dev.cdevents.ticket.created.0.2.0
  - event: dev.cdevents.ticket.updated.0.2.0
