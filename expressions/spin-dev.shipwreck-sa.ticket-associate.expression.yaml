# yaml-language-server: $schema=https://cdrus.dev/schemas/0.2.0/expression.schema.json
group: spin-dev
author: shipwreck-sa
expression: ticket-associate
description: |
  Shipwreck SA — service-account-owned audit ticket pattern. A ticket is
  opened in the change-management system and updated to associate it with
  downstream SDLC work. Used as both a precondition (e.g., production-deploy)
  and as a detached observer (e.g., deploy). (Ticket events are defined in CDEvents
  0.6.0-draft; pins reference their published catalog versions.)
produces:
  - event: dev.cdevents.ticket.created.0.2.0
  - event: dev.cdevents.ticket.updated.0.2.0
