# yaml-language-server: $schema=https://cdrus.dev/schemas/0.1.0/expression.schema.json
group: example-group
author: user
expression: deploy
description: Deployment lifecycle — taskrun brackets service operations.
produces:
  - event: dev.cdevents.taskrun.started.0.3.0
