# yaml-language-server: $schema=https://cdrus.dev/schemas/0.2.0/expression.schema.json
group: example-group
author: user
expression: review-change-request
description: SCM change-review pattern — a change is reviewed and merged into the target branch.
produces:
  - event: dev.cdevents.change.reviewed.0.3.0
  - event: dev.cdevents.change.merged.0.3.0
