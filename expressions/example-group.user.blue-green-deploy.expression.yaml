# yaml-language-server: $schema=https://cdrus.dev/schemas/0.2.0/expression.schema.json
group: example-group
author: user
expression: blue-green-deploy
description: Blue/green cutover — deploy green, verify, publish cutover, then remove blue.
produces:
  - event: dev.cdevents.service.deployed.0.3.0
  - expression: verify
  - event: dev.cdevents.service.published.0.3.0
  - event: dev.cdevents.service.removed.0.3.0
